# Webhook Service Configuration
# All properties support environment variable substitution using ${?ENV_VAR_NAME} syntax

# gRPC Server Configuration
grpc.server.port=10104
grpc.server.port=${?GRPC_SERVER_PORT}

# ZooKeeper Configuration (for message gateway discovery)
zookeeper.address="localhost:2181"
zookeeper.address=${?ZOOKEEPER_ADDRESS}
zookeeper.discovery.message-gateway="/ripple/services/message-gateway"
zookeeper.discovery.message-gateway=${?ZOOKEEPER_DISCOVERY_MESSAGE_GATEWAY}

# gRPC Client Configuration
grpc.client.user-presence.address="localhost:10101"
grpc.client.user-presence.address=${?GRPC_CLIENT_USER_PRESENCE_ADDRESS}

# Snowflake ID Server Configuration
snowflakeid.server.host="localhost"
snowflakeid.server.host=${?SNOWFLAKEID_SERVER_HOST}
snowflakeid.server.port=10100
snowflakeid.server.port=${?SNOWFLAKEID_SERVER_PORT}

# Redis Configuration
redis.host="localhost"
redis.host=${?REDIS_HOST}
redis.port=6379
redis.port=${?REDIS_PORT}

# Webhook HTTP Client Configuration
webhook.http.connect-timeout-ms=5000
webhook.http.connect-timeout-ms=${?WEBHOOK_HTTP_CONNECT_TIMEOUT_MS}
webhook.http.read-timeout-ms=30000
webhook.http.read-timeout-ms=${?WEBHOOK_HTTP_READ_TIMEOUT_MS}
webhook.http.max-retries=3
webhook.http.max-retries=${?WEBHOOK_HTTP_MAX_RETRIES}
webhook.http.retry-delay-ms=1000
webhook.http.retry-delay-ms=${?WEBHOOK_HTTP_RETRY_DELAY_MS}
